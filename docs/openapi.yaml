openapi: 3.0.3
info:
  title: API Salón de Estudio Colaborativo
  version: 0.3.0
  description: |
    API REST del Mini-proyecto 2 (Proyecto Integrador I, Universidad del Valle).
    El frontend nunca consulta Firestore directamente: todos los datos pasan por esta API.

    Todos los errores tienen la misma forma: `{ "error": { "codigo", "mensaje", "campos" } }`.
    `codigo` es estable y sirve para que el frontend decida qué hacer.
    `mensaje` está escrito para el estudiante, sin términos técnicos.
    `campos` aparece solo cuando el error es de un campo del formulario.
servers:
  - url: /
    description: Este mismo servidor (sirve para probar desde Swagger en Render)
  - url: https://pi1-salon-estudio-api.onrender.com
    description: Producción (Render)
  - url: http://localhost:3000
    description: Local

tags:
  - name: Salud
    description: Estado del servicio
  - name: Base técnica
    description: TS-00, prueba de punta a punta (frontend, API y Firestore)
  - name: Usuarios
    description: TS-01, registro, sesión y perfil. El inicio con correo lo hace Firebase en el navegador.
  - name: Salas
    description: US-06 y TS-02, crear salas y verlas en el panel.

paths:
  /health:
    get:
      tags: [Salud]
      operationId: obtenerSalud
      summary: Comprueba que el servicio está vivo
      security: []
      description: |
        La usa Render para saber si el servicio responde.
        No consulta Firestore, para que una falla de la base de datos no haga que Render reinicie la API.
      responses:
        '200':
          description: El servicio está funcionando
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado:
                    type: string
                    example: ok

  /api/v1/base-tecnica:
    get:
      tags: [Base técnica]
      operationId: obtenerBaseTecnica
      summary: Devuelve el dato de la base técnica guardado en Firestore
      security: []
      description: Lee el documento `base_tecnica/estado` de Firestore.
      responses:
        '200':
          description: Dato leído correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseTecnica'
        '404':
          description: El documento no existe en Firestore. Reintentar no lo soluciona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: DATO_NO_ENCONTRADO
                  mensaje: No encontramos la información que buscas.
        '503':
          description: Firestore no respondió. Tiene sentido reintentar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: BD_NO_DISPONIBLE
                  mensaje: No pudimos consultar los datos. Intenta de nuevo en unos segundos.
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/v1/usuarios:
    post:
      tags: [Usuarios]
      operationId: registrarConCorreo
      summary: Crea la cuenta con correo y contraseña
      security: []
      description: |
        Crea el usuario en Firebase Authentication y guarda el perfil en Firestore.
        El nombre de usuario se reserva en una transacción: si dos personas eligen el mismo, solo una queda.
        La contraseña no se guarda en Firestore.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroCorreo'
      responses:
        '201':
          description: Cuenta y perfil creados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '400':
          description: Hay campos inválidos. `campos` dice qué corregir en cada uno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El correo ya está registrado o el nombre de usuario está ocupado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/v1/usuarios/google:
    post:
      tags: [Usuarios]
      operationId: completarRegistroGoogle
      summary: Elige el nombre de usuario después de entrar con Google
      security:
        - firebaseAuth: []
      description: |
        El navegador ya autenticó a la persona con Google y envía el ID token.
        Esta ruta copia el nombre, el avatar y el correo del token, y completa el perfil.
        Si el perfil ya tenía nombre de usuario, lo devuelve sin cambiarlo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombreUsuario]
              properties:
                nombreUsuario:
                  type: string
                  example: ana_ruiz
      responses:
        '201':
          description: Perfil completo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '400':
          description: El nombre de usuario no cumple el formato, o la sesión no viene de Google.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '409':
          description: El nombre de usuario ya está en uso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/v1/sesion:
    get:
      tags: [Usuarios]
      operationId: obtenerSesion
      summary: Dice si la sesión tiene el perfil completo
      security:
        - firebaseAuth: []
      description: |
        Sirve después del ingreso. Si `perfilCompleto` es falso, la persona entró con Google
        y todavía debe elegir nombre de usuario. Esta ruta no exige el perfil completo.
      responses:
        '200':
          description: Sesión vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoSesion'
        '401':
          $ref: '#/components/responses/NoAutorizado'

  /api/v1/sesion/cerrar:
    post:
      tags: [Usuarios]
      operationId: cerrarSesion
      summary: Revoca la sesión en Firebase
      security:
        - firebaseAuth: []
      description: |
        Invalida los tokens de refresco. El navegador también debe descartar el ID token.
        Una petición posterior con el token revocado responde 401.
      responses:
        '204':
          description: Sesión revocada
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/v1/perfil:
    get:
      tags: [Usuarios]
      operationId: obtenerPerfil
      summary: Devuelve el perfil de la persona autenticada
      security:
        - firebaseAuth: []
      description: Sin token responde 401. Con Google y sin nombre de usuario responde 403.
      responses:
        '200':
          description: Perfil completo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/PerfilIncompleto'
    patch:
      tags: [Usuarios]
      operationId: actualizarPerfil
      summary: Actualiza nombres, apellidos, avatar, nombre de usuario y correo (US-04)
      security:
        - firebaseAuth: []
      description: |
        Se envía el formulario completo. El perfil que se cambia es siempre el del token: no hay uid en la ruta.

        - Nombre de usuario: la unicidad se revisa en el servidor dentro de una transacción.
          Cambiar solo mayúsculas y minúsculas del propio nombre no cuenta como colisión.
          El nombre anterior queda libre para otra persona.
        - Correo: solo se puede cambiar en cuentas creadas con correo. En cuentas de Google lo administra Google
          y la ruta responde 403 si llega un correo distinto al actual.
          Si el correo cambió, el navegador debe pedir un token nuevo (`getIdToken(true)`).
        - La contraseña no se cambia en esta ruta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioPerfil'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '400':
          description: Hay campos inválidos. `campos` dice qué corregir en cada uno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: DATOS_INVALIDOS
                  mensaje: Revisa los campos marcados.
                  campos:
                    nombreUsuario: 'Usa de 3 a 20 caracteres: empieza con una letra y sigue con letras, números o guion bajo.'
                    correo: Escribe un correo válido.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: Falta elegir el nombre de usuario, o una cuenta de Google intentó cambiar el correo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                perfilIncompleto:
                  summary: La cuenta de Google todavía no tiene nombre de usuario
                  value:
                    error:
                      codigo: PERFIL_INCOMPLETO
                      mensaje: Elige un nombre de usuario para continuar.
                correoNoEditable:
                  summary: Cuenta de Google que envía un correo distinto
                  value:
                    error:
                      codigo: CORREO_NO_EDITABLE
                      mensaje: Tu correo lo administra Google y no se puede cambiar aquí.
                      campos:
                        correo: Tu correo lo administra Google y no se puede cambiar aquí.
        '409':
          description: El nombre de usuario o el correo ya los usa otra cuenta. No se guardó ningún cambio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nombreUsuarioOcupado:
                  summary: Otra persona ya usa ese nombre de usuario
                  value:
                    error:
                      codigo: NOMBRE_USUARIO_OCUPADO
                      mensaje: Ese nombre de usuario ya está en uso. Elige otro.
                      campos:
                        nombreUsuario: Ese nombre de usuario ya está en uso. Elige otro.
                correoEnUso:
                  summary: Otra cuenta ya usa ese correo
                  value:
                    error:
                      codigo: CORREO_EN_USO
                      mensaje: Ese correo ya lo usa otra cuenta.
                      campos:
                        correo: Ese correo ya lo usa otra cuenta.
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    delete:
      tags: [Usuarios]
      operationId: eliminarCuenta
      summary: Elimina la cuenta y el perfil
      security:
        - firebaseAuth: []
      description: Borra el usuario de Firebase Authentication, el perfil y la reserva del nombre de usuario.
      responses:
        '204':
          description: Cuenta eliminada
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/PerfilIncompleto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'


  /api/v1/salas:
    post:
      tags: [Salas]
      operationId: crearSala
      summary: Crea una sala y deja como anfitrión al dueño del token (US-06)
      security:
        - firebaseAuth: []
      description: |
        El ID lo genera Firestore y es único. El anfitrión sale del token, nunca del cuerpo.
        El nombre se recorta y debe tener de 1 a 60 caracteres.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaNueva'
      responses:
        '201':
          description: Sala creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '400':
          description: El nombre está vacío o pasa de 60 caracteres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: DATOS_INVALIDOS
                  mensaje: Revisa los campos marcados.
                  campos:
                    nombre: Escribe un nombre de 1 a 60 caracteres.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/PerfilIncompleto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    get:
      tags: [Salas]
      operationId: listarSalasPropias
      summary: Lista solo las salas que creó el dueño del token (US-06)
      security:
        - firebaseAuth: []
      description: |
        Filtra en el servidor por el anfitrión del token y ordena de la más reciente a la más antigua.
        Si la persona no tiene salas, `salas` llega vacía y el panel muestra su mensaje.
      responses:
        '200':
          description: Salas de la persona (puede ser una lista vacía)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSalas'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/PerfilIncompleto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/v1/salas/{id}:
    get:
      tags: [Salas]
      operationId: obtenerSala
      summary: Devuelve una sala por su ID
      security:
        - firebaseAuth: []
      description: |
        Responde a cualquier persona con sesión, porque unirse con el ID (US-08) se basa en esto.
        `esAnfitrion` dice si quien pregunta creó la sala.
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la sala que generó Firestore.
          schema:
            type: string
            example: 7Qk2mXrB9tLwN4pZs1Ha
      responses:
        '200':
          description: Sala encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/PerfilIncompleto'
        '404':
          description: No existe una sala con ese ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: SALA_NO_ENCONTRADA
                  mensaje: No encontramos una sala con ese ID.
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

components:
  responses:
    NoAutorizado:
      description: No hay token, o el token no es válido o fue revocado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: NO_AUTORIZADO
              mensaje: Inicia sesión para continuar.
    PerfilIncompleto:
      description: La sesión es válida, pero falta elegir el nombre de usuario.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: PERFIL_INCOMPLETO
              mensaje: Elige un nombre de usuario para continuar.
    ServicioNoDisponible:
      description: Firebase o Firestore no respondieron. Tiene sentido reintentar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: SERVICIO_NO_DISPONIBLE
              mensaje: No pudimos completar la operación. Intenta de nuevo en unos segundos.
    ErrorInterno:
      description: Error inesperado del servidor. No expone detalles internos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERROR_INTERNO
              mensaje: Algo salió mal de nuestro lado. Intenta de nuevo más tarde.
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ID token de Firebase Authentication en el encabezado `Authorization: Bearer <token>`.
        Las rutas de sesión y de perfil lo exigen. El registro con correo es público.
  schemas:
    BaseTecnica:
      type: object
      required: [mensaje, actualizadoEn]
      properties:
        mensaje:
          type: string
          example: Base técnica conectada
        actualizadoEn:
          type: string
          format: date-time
          description: Fecha en ISO 8601 y UTC. El frontend la muestra en hora local.
          example: '2026-11-02T16:40:00.000Z'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo:
              type: string
              example: BD_NO_DISPONIBLE
            mensaje:
              type: string
              example: No pudimos consultar los datos. Intenta de nuevo en unos segundos.
            campos:
              type: object
              additionalProperties:
                type: string
              description: Presente solo cuando el error es de un campo del formulario.
    RegistroCorreo:
      type: object
      required: [nombres, apellidos, nombreUsuario, avatar, correo, contrasena]
      properties:
        nombres:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 80
        nombreUsuario:
          type: string
          description: De 3 a 20 caracteres. Empieza con letra y sigue con letras, números o guion bajo.
          example: ana_ruiz
        avatar:
          type: string
          description: Identificador o URL del avatar.
        correo:
          type: string
          format: email
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: Mínimo 8 caracteres. No se guarda en Firestore.
    CambioPerfil:
      type: object
      required: [nombres, apellidos, avatar, nombreUsuario, correo]
      properties:
        nombres:
          type: string
          maxLength: 80
          example: Ana
        apellidos:
          type: string
          maxLength: 80
          example: Ruiz
        avatar:
          type: string
          description: Identificador o URL del avatar.
          example: pino
        nombreUsuario:
          type: string
          description: De 3 a 20 caracteres. Empieza con letra y sigue con letras, números o guion bajo.
          example: ana_r
        correo:
          type: string
          format: email
          description: En cuentas de Google debe ser igual al actual.
          example: ana.ruiz@correounivalle.edu.co
    Perfil:
      type: object
      required: [uid, nombres, apellidos, nombreUsuario, avatar, correo, proveedor, creadoEn]
      properties:
        uid:
          type: string
        nombres:
          type: string
        apellidos:
          type: string
        nombreUsuario:
          type: string
        avatar:
          type: string
        correo:
          type: string
        proveedor:
          type: string
          enum: [correo, google]
        creadoEn:
          type: string
          format: date-time
    EstadoSesion:
      type: object
      required: [uid, correo, proveedor, perfilCompleto, perfil]
      properties:
        uid:
          type: string
        correo:
          type: string
        proveedor:
          type: string
          enum: [correo, google]
        perfilCompleto:
          type: boolean
        perfil:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Perfil'
    SalaNueva:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 60
          description: Se recortan los espacios del inicio y del final antes de validar.
          example: Cálculo II
    Sala:
      type: object
      required: [id, nombre, creadaEn, esAnfitrion]
      properties:
        id:
          type: string
          example: 7Qk2mXrB9tLwN4pZs1Ha
        nombre:
          type: string
          example: Cálculo II
        creadaEn:
          type: string
          format: date-time
          example: '2026-11-18T23:10:00.000Z'
        esAnfitrion:
          type: boolean
          description: Verdadero si quien pregunta creó la sala.
          example: true
    ListaSalas:
      type: object
      required: [salas]
      properties:
        salas:
          type: array
          items:
            $ref: '#/components/schemas/Sala'
